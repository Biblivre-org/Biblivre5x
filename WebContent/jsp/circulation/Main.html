<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Menu Árvore</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS do menu -->
    <link rel="stylesheet" href="menu.css">
</head>
<body class="p-3">

<nav aria-label="Menu de livros">
    <ul class="treeview" role="tree">

        <!-- NÓ COM FILHOS -->
        <li class="node" role="treeitem" aria-expanded="false">
            <button class="tree-toggle"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#obra"
                    aria-expanded="false"
                    aria-controls="obra">

                <span class="icon">+</span>
                <span class="label">Obra</span>
            </button>

            <!-- SUBMENU -->
            <ul id="obra" class="children collapse" role="group">
                <li class="leaf" role="treeitem">
                    <span class="label">Exemplar 1</span>
                </li>
                <li class="leaf" role="treeitem">
                    <span class="label">Exemplar 2</span>
                </li>
				                <li class="leaf" role="treeitem">
                    <span class="label">Exemplar 3</span>
                </li>
				                <li class="leaf" role="treeitem">
                    <span class="label">Exemplar 4</span>
                </li>
				                <li class="leaf" role="treeitem">
                    <span class="label">Exemplar 5</span>
                </li>
            </ul>
        </li>

    </ul>
</nav>




<nav aria-label="Menu de livros">
    <ul class="treeview" role="tree">

        <!-- NÓ COM FILHOS -->
        <li class="node" role="treeitem" aria-expanded="false">
            <button class="tree-toggle"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#obra2"
                    aria-expanded="false"
                    aria-controls="obra">

                <span class="icon">+</span>
                <span class="label">Obra 2</span>
            </button>

            <!-- SUBMENU -->
            <ul id="obra2" class="children collapse" role="group">
                <li class="leaf" role="treeitem">
                    <span class="label">Exemplar 1</span>
                </li>
                <li class="leaf" role="treeitem">
                    <span class="label">Exemplar 2</span>
                </li>
				                <li class="leaf" role="treeitem">
                    <span class="label">Exemplar 3</span>
                </li>
				                <li class="leaf" role="treeitem">
                    <span class="label">Exemplar 4</span>
                </li>
				                <li class="leaf" role="treeitem">
                    <span class="label">Exemplar 5</span>
                </li>
            </ul>
        </li>

    </ul>
</nav>




<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

<!-- JS do menu -->
<script src="menu.js"></script>

</body>
</html>
